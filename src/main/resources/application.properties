# Application name
spring.application.name=star

# PRIMARY DATASOURCE
spring.datasource.url=jdbc:h2:mem:appdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true

# SECONDARY DATASOURCE
application.recommendations-db.url=jdbc:h2:file:./transaction;DB_CLOSE_ON_EXIT=FALSE
application.recommendations-db.driver-class-name=org.h2.Driver

# App version
app.version=0.0.1-SNAPSHOT


logging.level.com.bank.star.star=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG


# Telegram Bot Configuration
telegram.bot.enabled=true
telegram.bot.name=star_bank_recommendations_bot
telegram.bot.username=star_bank_recommendations_bot
